apiVersion: fn.kpt.dev/v1alpha1
kind: StarlarkRun
metadata:
  name: setup-branding
  annotations:
    config.kubernetes.io/local-config: "true"
source: |-
  load("krmfn.star", "krmfn")

  # Prebuilt images published to ghcr.io (used when imageSource == "upstream", the default).
  UPSTREAM_PREFIX = "ghcr.io/kptdev/kpt-samples/otel-demo/"

  # Strip the upstream prefix to get the local tag (as built by
  # scripts/build_and_load.sh and loaded into the cluster), unless the
  # image already lives outside our registry (e.g. upstream OTel demo images).
  def local_tag(image):
    if image.startswith(UPSTREAM_PREFIX):
      return image[len(UPSTREAM_PREFIX):]
    return image

  def setup_branding(resources):
    # storeType + imageSource are read from the app-config ConfigMap (this
    # blueprint's single source of truth; deploy.sh stamps storeType there).
    store_type = ""
    image_source = "upstream"
    for r in resources:
      if krmfn.match_gvk(r, "v1", "ConfigMap") and krmfn.match_name(r, "app-config"):
        store_type = r.get("data", {}).get("storeType", "")
        image_source = r.get("data", {}).get("imageSource", "upstream")
        break

    # Treat a null/absent value as empty (YAML `storeType:` with no value → None).
    if store_type == None:
      store_type = ""
    if store_type == "":
      fail("storeType not found in app-config")

    # imageSource may be absent (older app-config) → default to upstream.
    if image_source == None or image_source == "":
      image_source = "upstream"
    if image_source not in ["upstream", "local"]:
      fail("imageSource '" + image_source + "' is invalid. Allowed values: upstream, local")

    store_data = {
      "florist": {
        "init_configmap": "florist-postgresql-init",
        "image_provider": UPSTREAM_PREFIX + "florist-image-provider:v1",
        "frontend_image": UPSTREAM_PREFIX + "florist-frontend:v1",
        "ad_image": UPSTREAM_PREFIX + "florist-ad:v1",
        "llm_image": UPSTREAM_PREFIX + "florist-llm:v1",
        "load_generator_image": UPSTREAM_PREFIX + "florist-load-generator:v1",
        "llm_product_id": "FLR001",
        "email_image": UPSTREAM_PREFIX + "florist-email:v1"
      },
      "astronomy": {
        "init_configmap": "astronomy-postgresql-init",
        "image_provider": "ghcr.io/open-telemetry/demo:2.2.0-image-provider",
        "frontend_image": UPSTREAM_PREFIX + "astronomy-frontend:v1",
        "ad_image": UPSTREAM_PREFIX + "astronomy-ad:v1",
        "llm_image": UPSTREAM_PREFIX + "astronomy-llm:v1",
        "load_generator_image": "ghcr.io/open-telemetry/demo:2.2.0-load-generator",
        "llm_product_id": "L9ECAV7KIM",
        "email_image": UPSTREAM_PREFIX + "astronomy-email:v1"
      },
    }

    if store_type not in store_data:
      fail("Unsupported storeType: " + store_type)

    if image_source == "local":
      for image_key in ["image_provider", "frontend_image", "ad_image", "llm_image", "load_generator_image", "email_image"]:
        store_data[store_type][image_key] = local_tag(store_data[store_type][image_key])

    data = store_data[store_type]

    # Find source postgresql init ConfigMap and copy its SQL
    init_sql = ""
    for r in resources:
      if krmfn.match_gvk(r, "v1", "ConfigMap") and krmfn.match_name(r, data["init_configmap"]):
        init_sql = r.get("data", {}).get("init.sql", "")
        break

    if init_sql == "":
      fail("init.sql not found in " + data["init_configmap"])

    # Create or update active-postgresql-init ConfigMap
    active_found = False
    for r in resources:
      if krmfn.match_gvk(r, "v1", "ConfigMap") and krmfn.match_name(r, "active-postgresql-init"):
        r["data"] = {"init.sql": init_sql}
        active_found = True
        break

    if not active_found:
      resources.append({
        "apiVersion": "v1",
        "kind": "ConfigMap",
        "metadata": {
          "name": "active-postgresql-init",
          "annotations": {"config.kubernetes.io/local-config": "true"}
        },
        "data": {"init.sql": init_sql}
      })

    # Create or update value-store ConfigMap
    store_found = False
    for r in resources:
      if krmfn.match_gvk(r, "v1", "ConfigMap") and krmfn.match_name(r, "value-store"):
        r["data"] = {
          "imageProviderImage": data["image_provider"],
          "frontendImage": data["frontend_image"],
          "adImage": data["ad_image"],
          "llmImage": data["llm_image"],
          "loadGeneratorImage": data["load_generator_image"],
          "llmProductId": data["llm_product_id"],
          "emailImage":data["email_image"]
        }
        store_found = True
        break

    if not store_found:
      resources.append({
        "apiVersion": "v1",
        "kind": "ConfigMap",
        "metadata": {
          "name": "value-store",
          "annotations": {"config.kubernetes.io/local-config": "true"}
        },
        "data": {
          "imageProviderImage": data["image_provider"],
          "frontendImage": data["frontend_image"],
          "adImage": data["ad_image"],
          "llmImage": data["llm_image"],
          "loadGeneratorImage": data["load_generator_image"],
          "llmProductId": data["llm_product_id"],
          "emailImage":data["email_image"]
        }
      })

    # Global search-replace for LLM product ID across all resources.
    # Replace every known product ID (from all stores) with the target store's ID
    # so switching between stores works bidirectionally.
    def replace_value(obj, old, new):
      if type(obj) == "string":
        return obj.replace(old, new)
      if type(obj) == "list":
        return [replace_value(item, old, new) for item in obj]
      if type(obj) == "dict":
        return {k: replace_value(v, old, new) for k, v in obj.items()}
      return obj

    all_product_ids = [store_data[k]["llm_product_id"] for k in store_data]
    for i in range(len(resources)):
      # Only touch resources that live inside the shop folder.
      # All other directories (branding/, observability/, regional/, etc.)
      # must be left untouched by the search-replace.
      path = resources[i].get("metadata", {}).get("annotations", {}).get("internal.config.kubernetes.io/path", "")
      if not path.startswith("shop/"):
        continue
      for old_id in all_product_ids:
        if old_id != data["llm_product_id"]:
          resources[i] = replace_value(resources[i], old_id, data["llm_product_id"])
          break

    # Stamp the active storeType onto every workload's POD TEMPLATE annotations.
    # A ConfigMap change (init SQL, flags, env) does NOT restart a running pod, so
    # a store switch would otherwise leave stateful pods (e.g. postgresql, which
    # only seeds its DB on a fresh container) serving the OLD store's data. By
    # putting the storeType in spec.template.metadata.annotations, switching stores
    # changes the pod spec, which forces Flux/Kubernetes to roll every workload —
    # so postgres re-seeds and all services pick up the new store.
    stamp_store_annotation(resources, store_type)

  # ─── Helpers ───

  def stamp_store_annotation(resources, store_type):
    workload_kinds = ["Deployment", "StatefulSet", "DaemonSet"]
    for r in resources:
      if r.get("kind", "") not in workload_kinds:
        continue
      # Navigate/create spec.template.metadata.annotations and set the stamp.
      spec = r.get("spec", None)
      if spec == None:
        continue
      template = spec.get("template", None)
      if template == None:
        continue
      meta = template.get("metadata", None)
      if meta == None:
        meta = {}
        template["metadata"] = meta
      ann = meta.get("annotations", None)
      if ann == None:
        ann = {}
        meta["annotations"] = ann
      ann["otel-demo/store-type"] = store_type

  setup_branding(ctx.resource_list["items"])
